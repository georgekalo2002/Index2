<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Σύστημα Αποκομιδής Τοξικότητας</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      padding: 50px 20px;
      margin: 0;
    }

    h1 {
      color: #ff4444;
      font-size: 2em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1em;
      margin-bottom: 30px;
      color: #aaaaaa;
    }

    textarea {
      width: 90%;
      max-width: 600px;
      height: 200px;
      background-color: #1e1e1e;
      color: #ffffff;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 15px;
      font-size: 16px;
      font-family: inherit;
      resize: none;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    textarea:focus {
      outline: none;
      border-color: #ff4444;
    }

    button {
      background-color: #ff4444;
      color: #fff;
      border: none;
      padding: 15px 40px;
      font-size: 1.2em;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 8px rgba(255, 68, 68, 0.2);
    }

    button:hover {
      background-color: #cc0000;
      transform: scale(1.05);
    }

    /* Animation εξαΰλωσης */
    .nuke-animation {
      animation: nukeIt 1s forwards;
    }

    @keyframes nukeIt {
      0% { transform: scale(1); opacity: 1; filter: blur(0); }
      50% { transform: scale(0.9) translateY(20px); opacity: 0.5; filter: blur(4px); background-color: #ff0000; }
      100% { transform: scale(0) translateY(100px); opacity: 0; filter: blur(10px); }
    }

    #successMessage {
      display: none;
      margin-top: 40px;
      padding: 20px;
      border: 1px solid #333;
      border-radius: 8px;
      background-color: #1a1a1a;
    }

    .success-text {
      color: #00ff00;
      font-size: 1.3em;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .karma-text {
      color: #e0e0e0;
      font-size: 1.1em;
    }
  </style>
</head>
<body>

  <div id="mainContainer">
    <h1>Σύστημα Αποκομιδής Τοξικότητας ☣️</h1>
    <p>Γράψε αναλυτικά τι μαλακία συνέβη σήμερα και ποιος πρέπει να πάει στο διάολο.</p>
    
    <textarea id="rantBox" placeholder="Ρίξε το δηλητήριο σου εδώ..."></textarea><br>
    
    <button id="nukeBtn" onclick="triggerNuke()">ΕΞΑΥΛΩΣΗ</button>
  </div>

  <div id="successMessage">
    <div class="success-text">✅ Ο στόχος κλείδωσε επιτυχώς.</div>
    <div class="karma-text">Τα δεδομένα διαγράφηκαν. Στέλνουμε 10 χρόνια κακό κάρμα, αϋπνία και γαστρεντερίτιδα στους υπεύθυνους. Εσύ πήγαινε να αράξεις.</div>
  </div>

  <script>
    function triggerNuke() {
      const box = document.getElementById('rantBox');
      const btn = document.getElementById('nukeBtn');
      const msg = document.getElementById('successMessage');

      // Αν είναι άδειο, δεν κάνει τίποτα
      if(box.value.trim() === "") {
        box.placeholder = "Γράψε κάτι πρώτα ρε...";
        return;
      }

      // Προσθήκη του animation
      box.classList.add('nuke-animation');
      btn.style.display = 'none';
      
      // Εμφάνιση του μηνύματος μετά το animation
      setTimeout(() => {
        box.style.display = 'none';
        msg.style.display = 'block';
      }, 1000);
    }
  </script>

</body>
</html>
